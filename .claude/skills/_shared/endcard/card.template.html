<!doctype html>
<meta charset="utf-8">
<title>__TITLE__</title>
<!--
  Authorship end card — the standard closing slide for a film made with these skills.

  Generated by build_card.py from a credits JSON file. DO NOT HAND-EDIT what the script
  produced: an edit that lands in the output instead of this template is lost at the next
  build. Fix the template or the data, then rebuild.

  Three properties this file must keep, because the film pipeline depends on them:

    1. The root #card carries data-om-exportable-video-with-duration-secs. The exporter
       reads the duration off that attribute and screenshots that element's box, so the
       box must measure exactly the authored size or the render aborts before frame 1.
    2. The card is time-invariant. It is a static composition, which makes it trivially
       a pure function of time and trivially deterministic. Do not add CSS transitions,
       keyframes or a clock: a composition that animates itself renders as a smear.
    3. No visible text below 28px computed. That is the shared composition floor, and it
       is the reason this card cannot carry fine print. Fewer, larger credits, or a
       second card — never smaller type.

  Fonts are spliced in at __FONTS__ as inlined woff2. Nothing is fetched at render time.
-->
<style>
/*__FONTS__*/

:root{
  /* Dark cinematic. Derived from this repository's house palette: the ink and paper of
     the intro film, with the teal accent lightened to hold contrast on a dark ground. */
  --ground:#0F0F11;   /* near-black; hides compression artefacts at the end of a film */
  --ink:#F5F3EE;      /* names */
  --soft:#9A958D;     /* role labels and secondary lines — 6.2:1 on --ground */
  --accent:#4FD1C5;   /* the rule and the kicker — 10.2:1 on --ground */
  --line:#2A2A2E;     /* hairline divider */
  --plate:#FFFFFF;    /* the panel a light-background logo sits on */

  --floor:28px;       /* the composition font floor. Nothing visible may be smaller. */
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000}
body{display:flex;align-items:center;justify-content:center;min-height:100vh}

#card{
  position:relative;
  width:__WIDTH__px;
  height:__HEIGHT__px;
  flex:none;
  background:var(--ground);
  color:var(--ink);
  font-family:'Instrument Sans',system-ui,sans-serif;
  padding:76px 120px 64px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* ---- header ---------------------------------------------------------------- */

.kicker{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--floor);
  line-height:1.2;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--accent);
}

h1.title{
  margin-top:16px;
  font-size:58px;
  line-height:1.08;
  font-weight:600;
  letter-spacing:-.015em;
  color:var(--ink);
}

.title-alt{
  margin-top:8px;
  font-size:34px;
  line-height:1.25;
  font-weight:400;
  color:var(--soft);
}

.rule{
  width:120px;
  height:8px;
  background:var(--accent);
  margin:24px 0 30px;
  flex:none;
}

/* ---- credits --------------------------------------------------------------- */

/* Spacing between blocks is row-gap, never a margin on the block itself. A margin-top on
   `.block + .block` would land on the second column's first block too, pushing it down
   relative to the first column's — and grid row heights would then stop matching what
   build_card.py estimates. The gap belongs to the grid, so both columns start level. */
.credits{
  flex:1 1 auto;
  display:grid;
  grid-template-columns:repeat(__COLS__,1fr);
  column-gap:96px;
  row-gap:26px;
  align-content:start;
  align-items:start;
}

.block{margin:0}

.block-label{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--floor);
  line-height:1.2;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--soft);
  padding-bottom:10px;
  border-bottom:1px solid var(--line);
  margin-bottom:14px;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,340px) minmax(0,1fr);
  column-gap:28px;
  align-items:baseline;
  margin-bottom:8px;
}

.role{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--floor);
  line-height:1.35;
  color:var(--soft);
}

.names{
  font-size:32px;
  line-height:1.3;
  font-weight:500;
  color:var(--ink);
}

.names .alt{
  display:block;
  font-size:var(--floor);
  line-height:1.3;
  font-weight:400;
  color:var(--soft);
}

/* ---- disclosure ------------------------------------------------------------ */

/* Required on every card. It is the line that says the narration is synthetic and what
   built the picture, and it is deliberately set apart from the credits so it reads as a
   statement rather than another name. */
.disclosure{
  flex:none;
  margin-top:20px;
  padding:16px 0 16px 22px;
  border-left:4px solid var(--accent);
  font-size:var(--floor);
  line-height:1.42;
  color:var(--ink);
}

/* ---- footer ---------------------------------------------------------------- */

footer{
  flex:none;
  margin-top:18px;
  padding-top:20px;
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  column-gap:64px;
}

/* A light-background institutional lockup needs a plate to stay legible on the dark
   ground. When a logo is present the wordmark is suppressed by the build, because these
   lockups already carry the institution's name and printing it twice reads as an error. */
.plate{
  flex:none;
  background:var(--plate);
  border-radius:6px;
  padding:14px 20px;
  display:flex;
  align-items:center;
}
.plate img{display:block;height:__LOGOH__px;width:auto}

.wordmark{
  flex:none;
  max-width:820px;
  font-size:var(--floor);
  line-height:1.35;
  font-weight:600;
  color:var(--ink);
}
.wordmark .alt{display:block;font-weight:400;color:var(--soft)}
.wordmark .funding{display:block;font-weight:400;color:var(--soft)}

/* The accountability stamp: who is answerable for what this film says, and where a viewer
   takes a correction. The label is what makes it a statement rather than one more name, and
   it is the reason the institution may legitimately appear here as well as on the left. */
.stamp{
  flex:1 1 auto;
  text-align:right;
  font-size:var(--floor);
  line-height:1.38;
  color:var(--soft);
}
.stamp .label{
  font-family:'JetBrains Mono',ui-monospace,monospace;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:var(--soft);
}
.stamp .who{display:block;color:var(--ink);font-weight:600}
.stamp .contact{
  display:block;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  color:var(--accent);
  word-break:break-word;
}

.page-of{
  position:absolute;
  right:120px;
  top:76px;
  font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:var(--floor);
  line-height:1.2;
  letter-spacing:.1em;
  color:var(--soft);
}
</style>

<div id="card" data-om-exportable-video-with-duration-secs="__DURATION__">
__CONTENT__
</div>

<script>
// The exporter dispatches a seek event carrying an instant, screenshots, and steps on. This
// card renders the same pixels at every instant by design, so the handler has nothing to do.
// It is registered anyway, so that the contract is visible in the file rather than implied by
// its absence — and so that anyone adding motion here finds the seam already named.
document.getElementById('card')
  .addEventListener('data-om-seek-to-time-frame', function () { /* time-invariant */ });
</script>
